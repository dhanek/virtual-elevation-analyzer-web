[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ve-batch"
version = "0.1.0"
description = "Config preparation and batch driver for the Virtual Elevation Analyzer headless runner"
requires-python = ">=3.9"
# Deliberately no required dependencies: the physics is single-sourced in the
# Rust/WASM runner, and this layer is subprocess + csv + json from the stdlib.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["ve_batch*"]

[tool.ruff]
line-length = 100
